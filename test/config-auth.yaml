providers:
    - name: llama.cpp
      base_url: http://localhost:8080/v1

    - name: dummy
      base_url: https://example.com/v1
      api_key: sk-12345

    - name: dummy_env
      base_url: https://example.com/v1
      api_key: env:DUMMY_API_KEY

models:
    - name: local/model
      provider: llama.cpp
      model: whatever

    - name: remote/model
      provider: dummy
      model: other-model

require_auth:
    - id: dummytoken
      token: my-12345
    - id: envtoken
      token: env:MY_ENV_TOKEN
