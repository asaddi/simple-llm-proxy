[package]
name = "simple-llm-proxy"
version = "0.1.0"
authors = ["Allan Saddi <allan@saddi.com>"]
edition = "2024"
description = "A super-lightweight LLM proxy for OpenAI-compatible providers"
readme = "README.md"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8.8"
bon = "3.9.3"
clap = { version = "4.6.6", features = ["derive"] }
noyalib = "0.0.28"
regex = "1.13.1"
reqwest = { version = "^0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "^0.1.44"
tracing-subscriber = { version = "^0.3.23", features = ["env-filter"] }

[dev-dependencies]
insta = { version = "1.48.0", default-features = false, features = ["redactions", "ron"] }
temp-env = "0.3.6"
